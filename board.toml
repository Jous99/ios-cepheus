# WARNING (migration 2026-10-25): these measurements (6 GB DRAM and userdata LBAs) are NOT confirmed on this unit.
# Before flashing anything, measure them again on the Mi 9 in use (see MIGRATION.md, section "Measure on the Mi 9").
# A wrong first_lba/last_lba can write over other partitions.
# Note: the [ipsw] section points to the iPad 17.7.11 (xnu-10063); the xnu-8796 series belongs to the iOS 16 line.
# UniXNU device repo for Xiaomi Mi 9 (cepheus, SM8150)
# Adapted from Lux12138/unixnu-nabu (2026-10-23).
# Values marked TODO_MEASURE must be measured on a real Xiaomi Mi 9 (TWRP/fastboot) before filling them in.
# Measurement method: see TODO-MEASURE.md (the original cited docs/cepheus-measure.md); platform references in ../notes/raphael-intel.md (not included in this repo)

[board]
name = "cepheus"
soc = "SM8150"
description = "Xiaomi Mi 9"
kit = "cepheus"

[ipsw]
# For a start, the iPad IPSW verified by nabu is reused (the SM8150 chain already works).
# Later the iPhone iOS 16.7.16 can be evaluated (the guacamole/raphael route was verified).
url = "https://updates.cdn-apple.com/2025SpringFCS/fullrestores/122-77166/DCA6CFE8-90E9-4B92-880D-3DE171798E40/iPad_Pro_HFR_17.7.11_21H461_Restore.ipsw"
product = "iPad7,1"
version = "17.7.11"
build = "21H461"
device_class = "j120ap"
chip_id = 0x8011
board_id = 12
# OS and Cryptex1,SystemOS are the two windows of the userdata image; without them there is no root to mount.
fetch = ["KernelCache", "DeviceTree", "StaticTrustCache", "Cryptex1,SystemTrustCache",
         "OS", "Cryptex1,SystemOS"]

[ipsw.sha256]
# The same nabu 17.7.11 IPSW is reused; the checksums match the nabu ones and must be recomputed when changing IPSW.
"044-76040-038.dmg" = "3f99b859c9728379110b66657c7b15285bcb1925ad8b5726542e2cdcf8b1028d"
"044-76034-038.dmg" = "b4908cde41d23e6bc05e6af51a2c9eeb00cf0f863a6a18b1600c96a3fd70414f"

[kernel]
defconfig = "cepheus_defconfig"
# The archive builders run in order before the kernel link. The list is the nabu one (common to SM8150).
# Note: build-libpthread-kernel.py must be in the list, or there is a panic: pthread kernel extension not loaded.
archives = [
    "build-corecrypto-14.py",
    "build-corecrypto-14.py --namespace",
    "build-arm-driver.py ArmDTPlatform",
    "build-arm-driver.py ArmCpu",
    "build-arm-driver.py NativeAES",
    "build-native-aes-bindings.py",
    "prepare-storage-headers.py",
    "build-arm-driver.py NativeUfs --unverified",
    "build-arm-driver.py NativeRamBlock",
    "build-libpthread-kernel.py",
  ]

[payload.adt]
# TODO: make-cepheus-adt.py is needed, adapted from
# scripts/make-nabu-adt.py in the Lux12138/UniXNU fork: fbcon node reg, resolution (1080x2340),
# dram_size. The nabu fbcon reg=<0x9C000000 0xC00000> is the framebuffer address of the nabu panel;
# the Mi 9 one must be measured in the device tree (TODO_MEASURE).
tool = "scripts/make-cepheus-adt.py"
# Measured on 2026-10-24 (TWRP): /proc/meminfo MemTotal = 5637008 kB ≈ 5.38 GiB,
# subtracting the modem/hyp/rmtfs reservations, the physical memory is the 6 GB variant => dram_size = 0x180000000,
# which matches the provisional value the CI ADT already uses (the fbcon reg is still to be measured with the UEFI boot).
owned_memory_size = "0x20000000"
dram_size = "0x180000000"          # measured on 2026-10-24: 6 GB variant
cpu_regs = "0,0x100,0x200,0x300,0x400,0x500,0x600,0x700"
packed_data_ramdisk = true
# vol_uuid of the OS volume: same IPSW as nabu (044-76040-038.dmg), same value;
# when changing IPSW, read it again with `7z l -slt <OS>.dmg | grep vol_uuid`.
root_match_volume_uuid = "04769d26-2ca0-4825-b443-e2e5f88300f2"
ipad_identity = true
unique_chip_id = false

[userdata]
# Measured on 2026-10-24 (TWRP, with the BL unlocked):
#   /dev/block/bootdevice/by-name/userdata -> /dev/block/sda31
#   /sys/block/sda/sda31/start = 4063232 sectors(512B) -> /8 = 507904 = 0x7C000 (4K LBA)
#   /sys/block/sda/sda31/size  = 233177048 sectors(512B) -> /8 = 29147131
#   last_lba = 507904 + 29147131 - 1 = 29655034 = 0x1C47FFA
#   (partition of about 111.2 GiB, consistent with a 128 GB model; still to be verified with fastboot getvar partition-size:userdata)
first_lba  = 0x7C000               # measured on 2026-10-24
last_lba   = 0x1C47FFA             # measured on 2026-10-24
lba_bytes = 4096
windows = [
  { name = "OS", component = "OS" },
  { name = "SystemOS", component = "Cryptex1,SystemOS" },
]

[kernel.prelink]
# kernelcache_sha256 is the verification pin of the kernelcache inside the chosen IPSW (checked on ipsw fetch),
# not the hash of our built output. nabu uses the same IPSW, same value; it must be recomputed when changing IPSW.
tool = "kits/NativePrelink/emit_prelink.py"
kernel = "build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped.noctf"
kernelcache_sha256 = "f18b4df865405f2a287b84977d7aca745e056d656d9fc9df1662970ce2969de7"
slide = "-0x1000000"
early_security_init = "com.apple.driver.AppleMobileFileIntegrity=0xfffffff005ab4ae0"
roots = [
    "com.apple.AppleFSCompression.AppleFSCompressionTypeZlib",
    "com.apple.driver.AppleARMPlatform",
    "com.apple.driver.AppleARMWatchdogTimer",
    "com.apple.driver.AppleAudioClockLibs",
    "com.apple.driver.AppleEffaceableStorage",
    "com.apple.driver.AppleIISController",
    "com.apple.driver.AppleM2ScalerCSCDriver",
    "com.apple.driver.AppleMobileFileIntegrity",
    "com.apple.driver.ApplePMGR",
    "com.apple.driver.IODARTFamily",
    "com.apple.filesystems.apfs",
    "com.apple.iokit.CoreAnalyticsFamily",
    "com.apple.iokit.IOAVFamily",
    "com.apple.iokit.IOAudio2Family",
    "com.apple.iokit.IOCECFamily",
    "com.apple.iokit.IOCryptoAcceleratorFamily",
    "com.apple.iokit.IOGPUFamily",
    "com.apple.iokit.IOHDCPFamily",
    "com.apple.iokit.IOMobileGraphicsFamily",
    "com.apple.iokit.IOReportFamily",
    "com.apple.iokit.IOSlowAdaptiveClockingFamily",
    "com.apple.iokit.IOStorageFamily",
    "com.apple.iokit.IOSurface",
    "com.apple.kec.Libm",
    "com.apple.kec.corecrypto",
    "com.apple.kext.AppleMatch",
    "com.apple.kext.CoreTrust",
    "com.apple.security.AppleImage4",
    "com.apple.security.sandbox",
    "com.apple.iokit.IOHIDFamily",
    "com.apple.iokit.IOHIDEventDriver",
  ]

# --- UEFI firmware (migration 2026-10-25) ---------------------------------------------------------
# Model: UniXNU-sheng/board.toml. Built with:  ./unixnu build firmware --uefi ../Mu-Silicium
# NOT VERIFIED on the phone. First uefi/cepheusPkg-unixnu.patch must be applied to Mu-Silicium
# (see docs/uefi-cepheus.md). The Mu patches are the ones applied by Mu-Silicium build_uefi.py.
[firmware]
config = "cepheus"
dsc = "Platforms/Xiaomi/cepheusPkg/cepheus.dsc"
fd = "Build/cepheusPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
submodules = ["Binaries", "Common/Mu", "Common/Mu_OEM_Sample", "Silicium-ACPI", "Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl"]
patches = [
  "Resources/MuPatches/AsmMacroLib.patch",
  "Resources/MuPatches/Auth-Service.patch",
  "Resources/MuPatches/Boot-Manager.patch",
  "Resources/MuPatches/Timer.patch",
  "Resources/MuPatches/Usb-Bus.patch",
]
packages = [
  "{uefi}", "{uefi}/Platforms/Xiaomi", "{tree}/package", "{tree}/drivers/DarwinBoot", "{edk2}",
  "{uefi}/Common/Mu", "{uefi}/Common/Mu_OEM_Sample", "{uefi}/Silicon/Qualcomm", "{uefi}/Silicon/Silicium",
  "{uefi}/Silicium-ACPI", "{uefi}/Silicium-ACPI/Platforms/Xiaomi", "{uefi}/Silicium-ACPI/Silicon/Qualcomm",
]

[firmware.defines]
DEVICE_MODEL = "cepheus"
ENABLE_SECUREBOOT = "0"
MEMORY_PROTECTION = "TRUE"
SHIP_MODE = "FALSE"
BUILDID_STRING = "cepheus-research"


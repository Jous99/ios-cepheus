name: mirror-forgejo

# Copia la rama que se empuja a Forgejo. No fuerza el push (sin --force):
# si la historia diverge, falla en vez de pisar nada.
on:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      target:
        description: 'Rama destino en Forgejo (vacío = la misma rama)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push a Forgejo
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
          INPUT_TARGET: ${{ inputs.target }}
        run: |
          TARGET="${INPUT_TARGET:-$GITHUB_REF_NAME}"
          [[ "$TARGET" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "rama destino no valida"; exit 1; }
          git push "https://Jous:${FORGEJO_TOKEN}@git.joustech.space/Jous/ios-cepheus.git" \
            "HEAD:refs/heads/${TARGET}"

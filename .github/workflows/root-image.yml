name: root-image

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Liberar espacio en el runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Descargar IPSW de iPhone X 16.7.16 (CDN de Apple)
        run: |
          curl -L --fail --retry 3 -o "$RUNNER_TEMP/ios.ipsw" \
            "https://updates.cdn-apple.com/2025FallFCS/fullrestores/122-77006/1158E502-D76D-4226-AA06-ED5E30CD1111/iPhone10,3,iPhone10,6_16.7.16_20H392_Restore.ipsw"
          ls -lh "$RUNNER_TEMP/ios.ipsw"

      - name: Comprobar soporte hfsplus
        run: |
          sudo modprobe hfsplus
          lsmod | grep hfsplus

      - name: Construir imagen root
        env:
          OUT: ${{ github.workspace }}/out/ios16-root.simg
          WORK: ${{ runner.temp }}/iosroot-build
        run: |
          mkdir -p out
          sed -i 's/\r$//' tools/*.sh shim/build.sh
          bash tools/build-root-wsl.sh "$RUNNER_TEMP/ios.ipsw"
          ls -lh out/

      - name: Subir imagen root
        uses: actions/upload-artifact@v4
        with:
          name: ios16-root
          path: out/ios16-root.simg
          retention-days: 7
          compression-level: 0
